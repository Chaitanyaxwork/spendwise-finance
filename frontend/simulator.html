<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#153f42"><meta name="description" content="Explore a savings scenario with clear assumptions."><title>Savings simulator — SpendWise</title><link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="./css/style.css"><script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script></head>
<body data-app-page="simulator" data-page-title="Savings simulator" data-page-subtitle="Explore what a steady savings plan could make possible." data-active="simulator">
  <div id="app"></div>
  <template id="page-content"><div class="page-content simulator-page">
    <section class="simulator-intro panel"><div><h2>Plan a savings scenario</h2><p>Set your starting point and monthly contribution, then compare the result with a target you choose.</p></div><span class="scenario-chip">Transparent assumptions</span></section>
    <section class="simulator-grid">
      <form class="panel simulator-inputs" id="simulator-form" novalidate><div class="panel-heading"><div><h2>Build a scenario</h2></div></div>
        <label for="sim-current">Current savings · INR</label><div class="money-input"><span aria-hidden="true">₹</span><input id="sim-current" name="currentSavings" type="number" min="0" step="0.01" value="125000" inputmode="decimal" required></div>
        <label for="sim-contribution">Monthly contribution · INR</label><div class="money-input"><span aria-hidden="true">₹</span><input id="sim-contribution" name="monthlyContribution" type="number" min="0" step="0.01" value="12000" inputmode="decimal" required></div>
        <label for="sim-target">Target amount · INR</label><div class="money-input"><span aria-hidden="true">₹</span><input id="sim-target" name="targetAmount" type="number" min="1" step="0.01" value="500000" inputmode="decimal" required></div>
        <div class="field-label-row"><label for="sim-months">Time period</label><output id="sim-months-output" for="sim-months">36 months</output></div><input id="sim-months" name="months" class="range-input" type="range" min="6" max="360" step="6" value="36">
        <div class="optional-return-row"><label class="switch-label" for="sim-use-return"><input id="sim-use-return" type="checkbox"><span>Include an assumed annual return</span></label><div class="rate-input"><input id="sim-return" name="annualReturnRate" type="number" min="0" max="30" step="0.1" value="6" inputmode="decimal" disabled aria-describedby="return-note"><span>% / year</span></div></div><p id="return-note" class="panel-caption">Optional, user-entered assumption; shown as a fixed annual rate compounded monthly.</p>
        <p id="simulator-message" class="form-message" aria-live="polite"></p><p class="form-footnote">Assumes contributions are made at each month’s end. This illustration excludes taxes, fees, inflation and changing returns. It is not a forecast or financial advice.</p>
      </form>
      <div class="simulator-results"><section class="panel result-hero"><p class="result-label">Projected savings</p><p class="result-amount" id="projected-total">—</p><p class="result-caption" id="projected-caption">Calculated from the assumptions you entered.</p><div class="result-rule"></div><div class="result-foot"><span>Monthly contribution</span><strong id="projected-monthly">—</strong></div></section><section class="scenario-results-grid" aria-label="Savings scenario results"><article class="panel result-summary-card"><span>Progress toward target</span><strong id="target-progress">—</strong><div class="progress-track" role="progressbar" id="target-progress-bar" aria-label="Savings target progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="target-progress-fill" class="progress-fill"></div></div><small id="target-progress-note">Calculated from your target</small></article><article class="panel result-summary-card"><span>Monthly amount needed</span><strong id="required-contribution">—</strong><small>To reach the target in this period, at the selected assumption.</small></article></section></div>
    </section>
    <section class="panel chart-panel"><div class="panel-heading"><div><h2>Projected balance by month</h2></div><span class="panel-caption" id="projection-period-label">—</span></div><div id="sim-chart-state" class="panel-state" hidden></div><div class="chart-wrap chart-tall"><canvas id="projection-chart" role="img" aria-label="Scenario line chart of projected savings over time"></canvas></div></section>
    <section class="panel projection-table-panel"><div class="panel-heading"><div><h2>Projection details</h2></div><span class="panel-caption">First and final months shown for longer periods</span></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Month</th><th>Contribution</th><th class="align-right">Projected balance</th></tr></thead><tbody id="projection-rows"></tbody></table></div></section>
  </div></template>
  <script src="./config.js"></script><script type="module" src="./js/simulator.js"></script>
</body>
</html>
