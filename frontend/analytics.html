<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#153f42"><meta name="description" content="Explore monthly trends and financial signals in SpendWise."><title>Analytics — SpendWise</title><link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="./css/style.css"><script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script></head>
<body data-app-page="analytics" data-page-title="Analytics" data-page-subtitle="Explore the detail behind your financial picture." data-active="analytics">
  <div id="app"></div>
  <template id="page-content"><div class="page-content analytics-page">
    <section class="page-intro"><div><h2>Spending analytics</h2><p>Track movement over time and keep the source of each signal clear.</p></div><div class="button-row"><label class="period-control" for="trend-period">Trend window<select id="trend-period"><option value="3">3 months</option><option value="6" selected>6 months</option><option value="12">12 months</option></select></label><button class="button button-secondary" id="generate-report" type="button">Generate report</button></div></section>
    <section class="metric-grid is-equation" aria-label="Latest month analytics"><article class="metric-card"><div class="metric-label">Income</div><strong id="analytics-income" class="metric-value">—</strong><small id="analytics-income-change">Latest available month</small></article><article class="metric-card"><div class="metric-label">Expenses</div><strong id="analytics-expenses" class="metric-value">—</strong><small id="analytics-expense-change">Latest available month</small></article><article class="metric-card"><div class="metric-label">Net savings</div><strong id="analytics-net" class="metric-value">—</strong><small id="analytics-net-change">Income less expenses</small></article><article class="metric-card"><div class="metric-label">Savings rate</div><strong id="analytics-rate" class="metric-value">—</strong><small id="analytics-rate-change">Of recorded income</small></article></section>
    <section class="content-grid chart-grid analytics-chart-grid"><article class="panel chart-panel"><div class="panel-heading"><div><h2>Income vs. expenses</h2></div><span id="analytics-monthly-caption" class="panel-caption">Latest 12 months</span></div><div id="monthly-chart-state" class="panel-state" hidden></div><div class="chart-wrap chart-tall"><canvas id="analytics-monthly-chart" role="img" aria-label="Monthly income and expenses chart"></canvas></div></article><article class="panel chart-panel"><div class="panel-heading"><div><h2>How expenses are moving</h2></div><span id="analytics-trend-caption" class="panel-caption">Last 6 months</span></div><div id="trend-chart-state" class="panel-state" hidden></div><div class="chart-wrap chart-tall"><canvas id="analytics-trend-chart" role="img" aria-label="Monthly expenses trend chart"></canvas></div></article></section>
    <section class="content-grid analytics-detail-grid"><article class="panel chart-panel"><div class="panel-heading"><div><h2>Spending by category</h2></div><span class="panel-caption">For the selected trend window</span></div><div id="category-chart-state" class="panel-state" hidden></div><div class="chart-wrap"><canvas id="analytics-category-chart" role="img" aria-label="Month-by-month category spending trend chart"></canvas></div><div id="analytics-category-legend" class="category-legend"></div></article><article class="panel"><div class="panel-heading"><div><h2>Recurring expenses</h2></div><span class="panel-caption">From analytics API</span></div><div id="recurring-list" class="signal-content"></div></article></section>
    <section class="analytics-signal-grid" aria-label="Additional analytics signals"><article class="panel"><div class="panel-heading"><div><h2>Spending anomalies</h2></div></div><div id="anomalies-list" class="signal-content"></div></article><article class="panel"><div class="panel-heading"><div><h2>Cash-flow forecast</h2></div></div><div id="forecast-list" class="signal-content"></div></article><article class="panel"><div class="panel-heading"><div><h2>Financial health</h2></div></div><div id="health-list" class="signal-content"></div></article></section>
    <section class="panel report-panel"><div class="panel-heading"><div><h2>Analytics report</h2><p class="panel-caption">Request a report from the connected service and review its supplied fields.</p></div><button class="button button-primary" id="generate-report-secondary" type="button">Generate report</button></div><div id="report-result" class="report-result" aria-live="polite"><p class="panel-caption">No report generated yet.</p></div></section>
    <p class="page-disclaimer">Analytics are shown only when present in the connected response. Demo mode derives monthly totals from sample transactions; forecast, anomaly detection and health scoring are not simulated.</p>
  </div></template>
  <script src="./config.js"></script><script type="module" src="./js/analytics.js"></script>
</body>
</html>
