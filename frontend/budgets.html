<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#153f42"><meta name="description" content="Plan monthly spending with category budgets."><title>Budgets — SpendWise</title><link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="./css/style.css"></head>
<body data-app-page="budgets" data-page-title="Budgets" data-page-subtitle="Give your spending a plan with room to breathe." data-active="budgets">
  <div id="app"></div>
  <template id="page-content"><div class="page-content">
    <section class="page-intro"><div><h2>Monthly budgets</h2><p>See what you planned, what you’ve used and what’s left.</p></div><button class="button button-primary" type="button" id="add-budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add budget</button></section>
    <section class="metric-grid is-equation" aria-label="Budget summary"><article class="metric-card"><div class="metric-label">Total budget</div><strong id="budget-total" class="metric-value">—</strong><small id="budget-period">This month</small></article><article class="metric-card"><div class="metric-label">Amount spent</div><strong id="budget-used" class="metric-value">—</strong><small>Recorded expenses in budgeted categories</small></article><article class="metric-card"><div class="metric-label">Remaining</div><strong id="budget-remaining" class="metric-value">—</strong><small id="budget-remaining-note">Across your monthly plan</small></article><article class="metric-card"><div class="metric-label">Overall utilization</div><strong id="budget-utilization" class="metric-value">—</strong><small>Spent compared with total budget</small></article></section>
    <section class="budget-section"><div class="panel-heading"><div><h2>Monthly limits</h2></div><span id="budget-count" class="panel-caption"></span></div><div id="budget-list" class="budget-grid"></div><div id="budget-empty" class="empty-state panel hidden"><span class="empty-icon" aria-hidden="true">◎</span><h3>Start with one category</h3><p>Add a monthly limit and SpendWise will show what’s used and what remains.</p><button class="button button-secondary" id="empty-add-budget" type="button">Add a budget</button></div></section>
    <p class="page-disclaimer">Category usage is derived from recorded expense transactions for the current month. Approaching-limit notices begin at 80% of the entered limit; these are planning indicators, not financial advice.</p>
    <dialog id="budget-dialog" class="form-dialog"><form id="budget-form" method="dialog" class="form-stack" novalidate><div class="dialog-heading"><div><h2 id="budget-dialog-title">Add a budget</h2></div><button class="icon-button" type="button" data-close-dialog="budget-dialog" aria-label="Close dialog">×</button></div><label for="budget-category">Category</label><input id="budget-category" name="category" list="budget-category-options" maxlength="32" required placeholder="e.g. Food"><datalist id="budget-category-options"><option>Housing</option><option>Food</option><option>Dining</option><option>Transport</option><option>Utilities</option><option>Healthcare</option><option>Shopping</option><option>Entertainment</option><option>Other</option></datalist><label for="budget-limit">Monthly limit · INR</label><div class="money-input"><span aria-hidden="true">₹</span><input id="budget-limit" name="limit" type="number" min="1" step="0.01" required inputmode="decimal" placeholder="0.00"></div><p id="budget-form-message" class="form-message" aria-live="polite"></p><div class="dialog-actions"><button class="button button-quiet" type="button" data-close-dialog="budget-dialog">Cancel</button><button class="button button-primary" type="submit"><span class="button-label">Save budget</span></button></div></form></dialog>
  </div></template>
  <script src="./config.js"></script><script type="module" src="./js/budgets.js"></script>
</body>
</html>
