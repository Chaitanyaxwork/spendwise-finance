<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#153f42"><meta name="description" content="Make savings goals visible and achievable."><title>Savings goals — SpendWise</title><link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="./css/style.css"></head>
<body data-app-page="goals" data-page-title="Savings goals" data-page-subtitle="Turn a future plan into steady, visible progress." data-active="goals">
  <div id="app"></div>
  <template id="page-content"><div class="page-content">
    <section class="page-intro"><div><h2>Your goals</h2><p>Track what you’ve saved toward each target.</p></div><button class="button button-primary" id="add-goal" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Create a goal</button></section>
    <section class="goal-highlight panel"><div class="goal-highlight-mark" aria-hidden="true">◈</div><div><h2>Plan your next contribution</h2><p>See how monthly contributions add up toward a target.</p></div><a class="text-link" href="./simulator.html">Open savings simulator</a></section>
    <section class="metric-grid metric-grid-compact" aria-label="Savings goal summary"><article class="metric-card metric-card-compact"><span class="metric-label">Active goals</span><strong id="goals-count" class="metric-value">—</strong></article><article class="metric-card metric-card-compact"><span class="metric-label">Saved so far</span><strong id="goals-saved" class="metric-value">—</strong></article><article class="metric-card metric-card-compact"><span class="metric-label">Total target</span><strong id="goals-target" class="metric-value">—</strong></article></section>
    <section class="goal-section"><div class="section-subhead"><div><h2>Active goals</h2></div><span id="goals-caption" class="panel-caption"></span></div><div id="goals-list" class="goals-grid"></div><div id="goals-empty" class="empty-state panel hidden"><span class="empty-icon" aria-hidden="true">◈</span><h3>What are you saving for?</h3><p>Create your first goal and make the next step feel tangible.</p><button class="button button-secondary" id="empty-add-goal" type="button">Create a goal</button></div></section>
    <p class="page-disclaimer">Goal progress reflects amounts entered for each goal. Milestones are personal planning tools, not financial advice.</p>
    <dialog id="goal-dialog" class="form-dialog"><form id="goal-form" method="dialog" class="form-stack" novalidate><div class="dialog-heading"><div><h2 id="goal-dialog-title">Create a goal</h2></div><button class="icon-button" type="button" data-close-dialog="goal-dialog" aria-label="Close dialog">×</button></div><label for="goal-name">Goal name</label><input id="goal-name" name="name" required maxlength="60" placeholder="e.g. Emergency fund"><div class="form-two-col"><div><label for="goal-target">Target amount · INR</label><div class="money-input"><span aria-hidden="true">₹</span><input id="goal-target" name="target" type="number" min="1" step="0.01" required inputmode="decimal" placeholder="0.00"></div></div><div><label for="goal-current">Current amount · INR</label><div class="money-input"><span aria-hidden="true">₹</span><input id="goal-current" name="current" type="number" min="0" step="0.01" required inputmode="decimal" placeholder="0.00"></div></div></div><label for="goal-date">Target date</label><input id="goal-date" name="targetDate" type="date"><p id="goal-form-message" class="form-message" aria-live="polite"></p><div class="dialog-actions"><button class="button button-quiet" type="button" data-close-dialog="goal-dialog">Cancel</button><button class="button button-primary" type="submit"><span class="button-label">Save goal</span></button></div></form></dialog>
    <dialog id="contribution-dialog" class="form-dialog"><form id="contribution-form" method="dialog" class="form-stack" novalidate><div class="dialog-heading"><div><h2 id="contribution-title">Add a contribution</h2><p id="contribution-current" class="panel-caption"></p></div><button class="icon-button" type="button" data-close-dialog="contribution-dialog" aria-label="Close dialog">×</button></div><label for="contribution-amount">Contribution amount · INR</label><div class="money-input"><span aria-hidden="true">₹</span><input id="contribution-amount" name="amount" type="number" min="0.01" step="0.01" required inputmode="decimal" placeholder="0.00"></div><p id="contribution-message" class="form-message" aria-live="polite"></p><div class="dialog-actions"><button class="button button-quiet" type="button" data-close-dialog="contribution-dialog">Cancel</button><button class="button button-primary" type="submit"><span class="button-label">Add contribution</span></button></div></form></dialog>
  </div></template>
  <script src="./config.js"></script><script type="module" src="./js/goals.js"></script>
</body>
</html>
