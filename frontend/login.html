<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153f42"><title>Log in — SpendWise</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="./css/style.css">
</head>
<body data-app-page="auth" data-auth-mode="login">
  <div id="app"></div>
  <template id="page-content">
    <section class="auth-card" aria-labelledby="auth-title">
      <p class="eyebrow">Welcome back</p><h1 id="auth-title">Good to see you.</h1><p class="auth-lede">Sign in to pick up where your plans left off.</p>
      <form id="login-form" class="form-stack" novalidate>
        <label for="login-email">Email address</label><input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <div class="field-row"><label for="login-password">Password</label><a class="small-link" href="#login-password" id="forgot-link">Forgot password?</a></div>
        <div class="password-field"><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" minlength="8" required><button class="password-toggle" type="button" data-toggle-password="login-password" aria-label="Show password">Show</button></div>
        <p id="login-message" class="form-message" aria-live="polite"></p>
        <button class="button button-primary button-full" type="submit"><span class="button-label">Log in</span></button>
      </form>
      <p class="auth-switch">New to SpendWise? <a href="./register.html">Create an account</a></p>
      <p class="demo-note"><span aria-hidden="true">ⓘ</span> Demo mode uses sample data stored only in this browser. Do not enter real financial credentials.</p>
    </section>
  </template>
  <script src="./config.js"></script><script type="module" src="./js/auth.js"></script>
</body>
</html>
