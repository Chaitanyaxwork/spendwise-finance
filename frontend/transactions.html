<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#153f42"><meta name="description" content="Search, review, and manage your SpendWise transactions."><title>Transactions — SpendWise</title><link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="./css/style.css"></head>
<body data-app-page="transactions" data-page-title="Transactions" data-page-subtitle="Every detail, easy to find and understand." data-active="transactions">
  <div id="app"></div>
  <template id="page-content"><div class="page-content">
    <section class="page-intro"><div><h2>Transaction history</h2><p>Search, filter and edit every record.</p></div><div class="button-row"><button class="button button-secondary" type="button" id="open-csv">Import CSV</button><input id="csv-file" class="visually-hidden" type="file" accept=".csv,text/csv" aria-label="Choose a transaction CSV file"><button class="button button-primary" type="button" id="add-transaction"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add transaction</button></div></section>
    <section class="metric-grid metric-grid-compact is-equation" aria-label="Current month transaction totals"><article class="metric-card metric-card-compact"><span class="metric-label">Income this month</span><strong id="transaction-income" class="metric-value">—</strong></article><article class="metric-card metric-card-compact"><span class="metric-label">Expenses this month</span><strong id="transaction-expenses" class="metric-value">—</strong></article><article class="metric-card metric-card-compact"><span class="metric-label">Net this month</span><strong id="transaction-net" class="metric-value">—</strong></article></section>
    <section id="csv-preview" class="panel csv-preview hidden" aria-live="polite"><div class="panel-heading"><div><h2>Review before importing</h2></div><button class="icon-button" type="button" id="close-csv-preview" aria-label="Close CSV preview">×</button></div><p id="csv-summary" class="panel-caption"></p><div class="table-scroll"><table class="data-table"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Type</th><th class="align-right">Amount · INR</th></tr></thead><tbody id="csv-rows"></tbody></table></div><div class="button-row preview-actions"><button class="button button-quiet" type="button" id="cancel-csv">Cancel</button><button class="button button-primary" type="button" id="confirm-csv">Import valid rows</button></div></section>
    <section class="panel transaction-panel" id="transaction-panel"><div class="panel-heading"><div><h2>Find a transaction</h2></div><span id="transaction-count" class="panel-caption">—</span></div>
      <div class="toolbar transaction-toolbar"><div class="search-field"><span aria-hidden="true">⌕</span><label class="visually-hidden" for="transaction-search">Search transactions</label><input id="transaction-search" type="search" placeholder="Search description or category"></div><label class="visually-hidden" for="type-filter">Filter by transaction type</label><select id="type-filter"><option value="all">All types</option><option value="income">Income</option><option value="expense">Expenses</option></select><label class="visually-hidden" for="category-filter">Filter by category</label><select id="category-filter"><option value="all">All categories</option></select><label class="date-filter-label" for="date-from">From<input id="date-from" type="date"></label><label class="date-filter-label" for="date-to">To<input id="date-to" type="date"></label><label class="visually-hidden" for="sort-filter">Sort transactions</label><select id="sort-filter"><option value="date-desc">Newest first</option><option value="date-asc">Oldest first</option><option value="amount-desc">Amount · high to low</option><option value="amount-asc">Amount · low to high</option><option value="name-asc">Description · A to Z</option></select></div>
      <div class="table-scroll"><table class="data-table transaction-table"><thead><tr><th>Description</th><th>Category</th><th>Date</th><th>Type</th><th class="align-right">Amount</th><th><span class="visually-hidden">Actions</span></th></tr></thead><tbody id="transaction-rows"></tbody></table></div>
      <div id="transaction-empty" class="empty-state hidden"><span class="empty-icon" aria-hidden="true">↗</span><h3>No transactions found</h3><p>Try changing your filters or add a transaction to begin.</p><button class="button button-secondary" id="empty-add-transaction" type="button">Add transaction</button></div>
      <div class="table-footer"><span id="pagination-label" class="panel-caption"></span><div class="pagination-controls"><button class="button button-quiet button-small" id="page-prev" type="button" aria-label="Previous page">← Previous</button><span id="page-number" class="page-number"></span><button class="button button-quiet button-small" id="page-next" type="button" aria-label="Next page">Next →</button></div></div>
    </section>
    <p class="page-disclaimer">Amounts are shown in Indian Rupees (INR). Demo changes are saved only in this browser.</p>
    <dialog id="transaction-dialog" class="form-dialog"><form id="transaction-form" method="dialog" class="form-stack" novalidate><div class="dialog-heading"><div><h2 id="transaction-dialog-title">Add transaction</h2><p class="panel-caption">Enter an amount in Indian Rupees.</p></div><button class="icon-button" type="button" data-close-dialog="transaction-dialog" aria-label="Close dialog">×</button></div><label for="tx-description">Description</label><input id="tx-description" name="description" required maxlength="80" placeholder="e.g. Groceries"><div class="form-two-col"><div><label for="tx-amount">Amount</label><div class="money-input"><span aria-hidden="true">₹</span><input id="tx-amount" name="amount" type="number" min="0.01" step="0.01" required inputmode="decimal" placeholder="0.00"></div></div><div><label for="tx-type">Type</label><select id="tx-type" name="type"><option value="expense">Expense</option><option value="income">Income</option></select></div></div><div class="form-two-col"><div><label for="tx-category">Category</label><input id="tx-category" name="category" list="category-options" required maxlength="32" placeholder="e.g. Food"><datalist id="category-options"><option>Housing</option><option>Food</option><option>Dining</option><option>Transport</option><option>Utilities</option><option>Healthcare</option><option>Shopping</option><option>Entertainment</option><option>Income</option><option>Other</option></datalist></div><div><label for="tx-date">Date</label><input id="tx-date" name="date" type="date" required></div></div><p id="transaction-form-message" class="form-message" aria-live="polite"></p><div class="dialog-actions"><button class="button button-quiet" type="button" data-close-dialog="transaction-dialog">Cancel</button><button class="button button-primary" type="submit"><span class="button-label">Save transaction</span></button></div></form></dialog>
  </div></template>
  <script src="./config.js"></script><script type="module" src="./js/transactions.js"></script>
</body>
</html>
